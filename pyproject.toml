[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cica"
version = "1.0.2"
description = "Conflict-Informed Consensus Arbitration for multimodal sentiment analysis"
requires-python = ">=3.10,<3.13"
dependencies = ["numpy>=1.24,<2", "torch>=2.2,<3"]

[project.optional-dependencies]
bert = ["transformers>=4.40,<4.45", "safetensors>=0.4"]

[project.scripts]
cica = "cica.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
